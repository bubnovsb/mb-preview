<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="yandex" content="none">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Private page</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23401019'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23f4ece1' text-anchor='middle'%3EMB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;height:100%}
  body{background:#1c080d;color:#f4ece1;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #gate{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;
    background:radial-gradient(90% 70% at 50% 0%,#4a1420 0%,#1c080d 70%)}
  #gate[hidden]{display:none}
  .gate-card{width:100%;max-width:400px;text-align:center}
  .gate-mark{font-family:"Cormorant Garamond",Georgia,serif;font-size:64px;line-height:1;letter-spacing:.04em;font-style:italic;color:#d9b36c}
  .gate-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:500;margin:18px 0 6px}
  .gate-sub{font-size:14px;line-height:1.6;color:#cdb9b3;margin:0 0 26px}
  .gate-form{display:flex;gap:8px}
  .gate-form input{flex:1;min-width:0;font:inherit;font-size:16px;padding:13px 16px;border-radius:999px;border:1px solid #6d3a44;background:#2a0d14;color:#f4ece1;outline:none}
  .gate-form input:focus{border-color:#d9b36c}
  .gate-form button{font:inherit;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:0;background:#d9b36c;color:#1c080d;cursor:pointer}
  .gate-form button:disabled{opacity:.6;cursor:progress}
  .gate-msg{min-height:22px;margin-top:14px;font-size:14px;color:#f0a39a}
  .gate-load{font-size:14px;color:#cdb9b3;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-mark" aria-hidden="true">MB</div>
    <div id="gate-loading" class="gate-load" hidden>Opening…</div>
    <div id="gate-ask" hidden>
      <h1 class="gate-title">Private portfolio</h1>
      <p class="gate-sub">Enter the password you were given.<br>Введите пароль · Saisissez le mot de passe</p>
      <form class="gate-form" id="gate-form" autocomplete="off">
        <input id="gate-pass" type="password" aria-label="Password" placeholder="Password" required>
        <button id="gate-btn" type="submit">Open</button>
      </form>
      <div class="gate-msg" id="gate-msg" role="alert"></div>
    </div>
    <noscript><p class="gate-sub">This page needs JavaScript to open.</p></noscript>
  </div>
</div>
<div id="app" hidden></div>
<script type="application/json" id="cfg">{"salt": "40W8leHICmOcgrz72Yhx5g==", "iter": 600000, "wrapped": "uSpMb9mbiPAI1mRNeSyXtyFDz/jSEY8fLnlusUkDRilBY13YYxQEo6TwQrLaCTQql0bEgbT31MgJ2oJr"}</script>
<script src="boot.js"></script>
</body>
</html>
