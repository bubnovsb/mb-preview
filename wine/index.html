  .gate-msg{min-height:22px;margin-top:14px;font-size:14px;line-height:1.6;color:#f0a39a}
  .gate-load{font-size:14px;color:#cdb9b3;letter-spacing:.08em;text-transform:uppercase}
</style>

<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-mark" aria-hidden="true">MB</div>

  </div>
</div>
